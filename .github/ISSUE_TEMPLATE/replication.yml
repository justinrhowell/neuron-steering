name: Replication result
description: You reran an experiment on another model, revision, dose, judge or hardware (reproduced or not)
labels: ["replication"]
body:
  - type: input
    id: what
    attributes: {label: What you reran, placeholder: "4B personality presets at dose 0.5"}
    validations: {required: true}
  - type: dropdown
    id: outcome
    attributes: {label: Outcome, options: ["Reproduced", "Partly reproduced", "Did not reproduce"]}
    validations: {required: true}
  - type: textarea
    id: setup
    attributes: {label: Setup, description: "Model + revision, dtype or quantisation, transformers/torch versions, GPU, judge model."}
    validations: {required: true}
  - type: textarea
    id: results
    attributes: {label: Results, description: Summary numbers and anything surprising. Attach or link the run files.}
    validations: {required: true}
